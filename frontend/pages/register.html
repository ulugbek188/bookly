<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | Bookly</title>
    <link rel="stylesheet" href="../assets/css/main.css"><link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
<main class="auth-page"><section class="auth-card">
    <div class="auth-top"><button class="icon-button" data-theme-toggle type="button" aria-label="Switch theme">◐</button></div>
    <div class="auth-logo"><h1 class="auth-brand-lockup"><img src="../assets/images/bookly-icon.png" alt=""><span>Bookly</span></h1><p class="auth-subtitle">Make room for your next favorite story.</p></div>
    <form id="register-form">
        <div class="form-group"><label for="username">Username</label><input id="username" minlength="3" maxlength="50" autocomplete="username" required></div>
        <div class="form-group"><label for="password">Password</label><input id="password" type="password" minlength="8" maxlength="50" autocomplete="new-password" required></div>
        <button class="primary-button auth-submit" type="submit">Create account</button><p id="register-message" class="message"></p>
    </form>
    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
</section></main>
<script src="../assets/js/api.js"></script><script src="../assets/js/theme.js"></script><script src="../assets/js/auth.js"></script>
</body>
</html>
