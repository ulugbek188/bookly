<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account | Bookly</title>
    <link rel="stylesheet" href="assets/css/main.css"><link rel="stylesheet" href="assets/css/auth.css">
</head>
<body data-page="register" data-shell="off">
<main class="auth auth-register">
    <div class="auth-main">
        <div class="auth-topbar">
            <button class="icon-btn" data-theme-toggle type="button" aria-label="Switch theme">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"/>
                </svg>
            </button>
        </div>

        <section class="auth-card">
            <div class="auth-brand">
                <h1 class="brand auth-brand-lockup"><img src="assets/images/bookly-icon.png" alt=""><span>Bookly</span></h1>
                <p>Make room for your next favorite story.</p>
            </div>

            <form class="auth-form" id="register-form" novalidate>
                <div class="field">
                    <label for="username">Username</label>
                    <input class="input" id="username" type="text" minlength="3" maxlength="50" autocomplete="username" placeholder="Choose a username" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input class="input" id="password" type="password" minlength="8" maxlength="50" autocomplete="new-password" placeholder="At least 8 characters" required>
                </div>

                <button class="btn btn-primary btn-lg btn-block auth-submit" type="submit">Create account</button>
                <p id="register-message" class="form-message" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section class="auth-switch">
            Already have an account?
            <a href="login.html">Log in</a>
        </section>
    </div>
</main>
<script src="assets/js/config.js"></script><script src="assets/js/api.js"></script><script src="assets/js/theme.js"></script><script src="assets/js/auth.js"></script>
</body>
</html>
